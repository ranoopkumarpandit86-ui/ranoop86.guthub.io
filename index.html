<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रनूप कुमार | पोर्टफोलियो</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #ebf8ff 0%, #cee7ff 100%);
            color: #233748;
            padding: 30px 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
            border-top: 8px solid #1a365d;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #e2e8f0;
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #fff;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        header h1 {
            color: #1a365d;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .english-name {
            font-size: 1.8rem;
            color: #2b6cb0;
            font-weight: 600;
            margin-bottom: 12px;
        }
        header p {
            font-size: 1.15rem;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 15px;
        }
        h2 {
            color: #1a365d;
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .social-links {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 35px;
            margin: 8px;
            color: white;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .fb { background: #1877f2; }
        .wa { background: #25d366; }
        
        /* बटन चमकाने (Hover) का कमाल का इफेक्ट */
        button:hover, .btn:hover, a:hover {
            background-color: darkorange !important;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        button, .btn, a {
            transition: all 0.3s ease-in-out;
        }

        @media (max-width: 650px) {
            .container { padding: 25px; }
            header h1 { font-size: 2.2rem; }
            .english-name { font-size: 1.5rem; }
            .contact-info { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="myphoto.jpeg" alt="रणूप कुमार" class="profile-img">
        <h1>रणूप कुमार</h1>
        <div class="english-name">Ranoop Kumar</div>
        <p>Welcome to my Portfolio | मेरे डिजिटल प्रोफ़ाइल पर आपका स्वागत है</p>
        
        <div class="contact-info" style="margin-top: 15px;">
            <a href="mailto:ranoop.kumarpandit@gmail.com" style="margin-right: 15px; text-decoration: none; color: #2b6cb0;">ranoop.kumarpandit@gmail.com</a>
            <a href="tel:+919016060061" style="text-decoration: none; color: #2b6cb0;">+91 90160 60061</a>
        </div>
    </header>

    <!-- संपर्क फ़ॉर्म सेक्शन -->
    <section id="contact">
        <h2>CONTACT ME</h2>
        <form action="https://formspree.io" method="POST">
            <div class="card">
                <div style="margin-bottom: 15px;">
                    <label for="name" style="display:block; margin-bottom:5px; font-weight:600;">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:6px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="message" style="display:block; margin-bottom:5px; font-weight:600;">Your Message:</label>
                    <textarea id="message" name="message" placeholder="Write message here" required style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:6px; height:100px;"></textarea>
                </div>
                <button type="submit" class="btn fb" style="width:100%; margin:0;">Submit Message</button>
            </div>
        </form>
    </section>

    <!-- सोशल लिंक्स -->
    <div class="social-links">
        <a href="https://facebook.com" class="btn fb" target="_blank">Facebook Profile</a>
        <a href="https://wa.me" class="btn wa" target="_blank">WhatsApp Chat</a>
    </div>
</div>

</body>
</html>
